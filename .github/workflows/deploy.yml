name: Deploy Hugo to GitHub Pages

# Pull requests run the build and link check only; pushes to master also deploy.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.170.1'
          extended: true

      - name: Build
        run: hugo --gc --minify --cleanDestinationDir --enableGitInfo --environment production --panicOnWarning

      - name: Check internal links
        # safari-pinned-tab.svg is linked by the theme on every page; ignore it until an icon is added.
        run: python3 .github/scripts/check_links.py public "https://raedaddala.github.io/" --ignore /safari-pinned-tab.svg

      - name: Deploy to External Repo
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          external_repository: RaedAddala/RaedAddala.github.io
          publish_branch: master
          publish_dir: ./public
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy Hugo site ${{ github.sha }}'